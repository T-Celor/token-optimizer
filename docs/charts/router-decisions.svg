<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 518" width="720" height="518" role="img" aria-labelledby="chart-router-decisions-t chart-router-decisions-d">
<title id="chart-router-decisions-t">How the router decided, request by request (XL session)</title>
<desc id="chart-router-decisions-d">Line chart of context size in thousands of tokens against request index 0 to 76, rising from 20.0k to 68.4k. Shaded zones: below 40k the router goes direct with no analysis; 40k to 100k it runs a dry run and switches only if the saving pays back within 20 requests. Dry-run savings S are annotated at requests 47 to 76, ending at 37.4k when it switched to pxpipe.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--blue:#2a78d6;--red:#e34948}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--blue:#3987e5;--red:#e66767}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1.5}
.base,.down{fill:var(--blue)}.up{fill:var(--red)}.other{fill:var(--muted)}
.zoneA{fill:var(--muted);fill-opacity:.12}.zoneB{fill:var(--blue);fill-opacity:.10}
.line{fill:none;stroke:var(--blue);stroke-width:2}
.dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}
</style>
<text x="24" y="28" class="ink" font-size="16" font-weight="600">How the router decided, request by request (XL session)</text><text x="24" y="50" class="ink2" font-size="13">Context size at each request. S is the estimated saving from the dry run (k tokens).</text><rect class="zoneB" x="70" y="120" width="610" height="156"/><rect class="zoneA" x="70" y="276" width="610" height="104"/><text x="80" y="138" class="ink2" font-size="12">40k to 100k (20% to 50% of 200k): dry run, switch only if it pays back within 20 requests</text><text x="80" y="364" class="ink2" font-size="12">Below 40k (under 20% of 200k): direct, no analysis</text><text x="70" y="108" class="ink2" font-size="12">Context size (k tokens)</text><text x="62" y="384" class="ink2" font-size="12" text-anchor="end">0k</text><line class="grid" x1="70" y1="328" x2="680" y2="328"/><text x="62" y="332" class="ink2" font-size="12" text-anchor="end">20k</text><line class="grid" x1="70" y1="276" x2="680" y2="276"/><text x="62" y="280" class="ink2" font-size="12" text-anchor="end">40k</text><line class="grid" x1="70" y1="224" x2="680" y2="224"/><text x="62" y="228" class="ink2" font-size="12" text-anchor="end">60k</text><line class="grid" x1="70" y1="172" x2="680" y2="172"/><text x="62" y="176" class="ink2" font-size="12" text-anchor="end">80k</text><line class="grid" x1="70" y1="120" x2="680" y2="120"/><text x="62" y="124" class="ink2" font-size="12" text-anchor="end">100k</text><line class="axis" x1="70" y1="380" x2="680" y2="380"/><text x="70" y="396" class="ink2" font-size="12" text-anchor="middle">0</text><text x="150.26315789473682" y="396" class="ink2" font-size="12" text-anchor="middle">10</text><text x="230.52631578947367" y="396" class="ink2" font-size="12" text-anchor="middle">20</text><text x="310.7894736842105" y="396" class="ink2" font-size="12" text-anchor="middle">30</text><text x="391.05263157894734" y="396" class="ink2" font-size="12" text-anchor="middle">40</text><text x="471.3157894736842" y="396" class="ink2" font-size="12" text-anchor="middle">50</text><text x="551.578947368421" y="396" class="ink2" font-size="12" text-anchor="middle">60</text><text x="631.8421052631579" y="396" class="ink2" font-size="12" text-anchor="middle">70</text><text x="375" y="414" class="ink2" font-size="12" text-anchor="middle">Request index</text><path class="line" d="M70.0,328.0L447.2,272.9L479.3,260.1L519.5,243.8L559.6,229.7L599.7,215.9L639.9,206.1L680.0,202.2"/><circle class="dot" cx="70.0" cy="328.0" r="4"/><circle class="dot" cx="447.2" cy="272.9" r="4"/><circle class="dot" cx="479.3" cy="260.1" r="4"/><circle class="dot" cx="519.5" cy="243.8" r="4"/><circle class="dot" cx="559.6" cy="229.7" r="4"/><circle class="dot" cx="599.7" cy="215.9" r="4"/><circle class="dot" cx="639.9" cy="206.1" r="4"/><circle class="dot" cx="680.0" cy="202.2" r="4"/><text x="676" y="188.15999999999997" class="ink" font-size="12" text-anchor="end">switched to pxpipe</text><text x="24" y="440" class="ink2" font-size="12">Saving S</text><text x="447.2" y="440" class="ink" font-size="12" text-anchor="middle">12.6k</text><text x="479.3" y="440" class="ink" font-size="12" text-anchor="middle">21.2k</text><text x="519.5" y="440" class="ink" font-size="12" text-anchor="middle">22.2k</text><text x="559.6" y="440" class="ink" font-size="12" text-anchor="middle">23.0k</text><text x="599.7" y="440" class="ink" font-size="12" text-anchor="middle">23.6k</text><text x="639.9" y="440" class="ink" font-size="12" text-anchor="middle">24.0k</text><text x="680.0" y="440" class="ink" font-size="12" text-anchor="middle">37.4k</text><text x="24" y="470" class="ink2" font-size="12">Calibrated estimate stayed within about 1% of the real size Anthropic reported.</text><text x="24" y="500" class="ink2" font-size="11">Plain Claude Code = baseline. Opus 5.5. Source: README.md, Results</text>
</svg>
