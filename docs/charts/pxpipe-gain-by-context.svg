<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="chart-pxpipe-gain-by-context-t chart-pxpipe-gain-by-context-d">
<title id="chart-pxpipe-gain-by-context-t">Adding pxpipe after RTK + Ponytail + Headroom: cost change by session size</title>
<desc id="chart-pxpipe-gain-by-context-d">Diverging bar chart of the cost change when pxpipe is added after RTK, Ponytail and Headroom. Workday (7 requests, baseline peak 26k tokens): +18.0%. Long (18 requests, baseline peak 47k): -5.3%. XL (29 requests, baseline peak 303k): -27.2%.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--blue:#2a78d6;--red:#e34948}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--blue:#3987e5;--red:#e66767}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1.5}
.base,.down{fill:var(--blue)}.up{fill:var(--red)}.other{fill:var(--muted)}
.zoneA{fill:var(--muted);fill-opacity:.12}.zoneB{fill:var(--blue);fill-opacity:.10}
.line{fill:none;stroke:var(--blue);stroke-width:2}
.dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}
</style>
<text x="24" y="28" class="ink" font-size="16" font-weight="600">Adding pxpipe after RTK + Ponytail + Headroom: cost change by session</text><text x="24" y="50" class="ink" font-size="16" font-weight="600">size</text><text x="24" y="72" class="ink2" font-size="13">pxpipe saves money only when the context is large. One session per scenario.</text><rect class="up" x="24" y="89" width="12" height="12" rx="2"/><text x="42" y="99" class="ink2" font-size="13">Cost up (more expensive)</text><rect class="down" x="236" y="89" width="12" height="12" rx="2"/><text x="254" y="99" class="ink2" font-size="13">Cost down (cheaper)</text><line class="grid" x1="210" y1="118" x2="210" y2="350"/><line class="grid" x1="290" y1="118" x2="290" y2="350"/><line class="grid" x1="370" y1="118" x2="370" y2="350"/><line class="grid" x1="530" y1="118" x2="530" y2="350"/><line class="grid" x1="610" y1="118" x2="610" y2="350"/><line class="grid" x1="690" y1="118" x2="690" y2="350"/><line class="axis" x1="450" y1="118" x2="450" y2="350"/><text x="210" y="366" class="ink2" font-size="12" text-anchor="middle">-30%</text><text x="290" y="366" class="ink2" font-size="12" text-anchor="middle">-20%</text><text x="370" y="366" class="ink2" font-size="12" text-anchor="middle">-10%</text><text x="450" y="366" class="ink2" font-size="12" text-anchor="middle">0%</text><text x="530" y="366" class="ink2" font-size="12" text-anchor="middle">+10%</text><text x="610" y="366" class="ink2" font-size="12" text-anchor="middle">+20%</text><text x="690" y="366" class="ink2" font-size="12" text-anchor="middle">+30%</text><text x="24" y="136" class="ink" font-size="13" font-weight="600">Workday, 7 requests</text><text x="24" y="152" class="ink2" font-size="12">Baseline peak 26k tokens. Cost $0.2786 -&gt; $0.3286</text><path class="up" d="M450,160H590Q594,160 594,164V182Q594,186 590,186H450Z"/><text x="602" y="177" class="ink" font-size="13" text-anchor="start" font-weight="600">+18.0%</text><text x="24" y="214" class="ink" font-size="13" font-weight="600">Long, 18 requests</text><text x="24" y="230" class="ink2" font-size="12">Baseline peak 47k tokens. Cost $0.954 -&gt; $0.903</text><path class="down" d="M450,238H411.6Q407.6,238 407.6,242V260Q407.6,264 411.6,264H450Z"/><text x="399.6" y="255" class="ink" font-size="13" text-anchor="end" font-weight="600">-5.3%</text><text x="24" y="292" class="ink" font-size="13" font-weight="600">XL, 29 requests</text><text x="24" y="308" class="ink2" font-size="12">Baseline peak 303k tokens. Cost $3.144 -&gt; $2.288</text><path class="down" d="M450,316H236.4Q232.4,316 232.4,320V338Q232.4,342 236.4,342H450Z"/><text x="224.4" y="333" class="ink" font-size="13" text-anchor="end" font-weight="600">-27.2%</text><text x="24" y="390" class="ink2" font-size="11">Plain Claude Code = baseline. Opus 5.5. Source: README.md, Results</text>
</svg>
