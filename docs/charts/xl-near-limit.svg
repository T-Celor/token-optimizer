<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 415" width="720" height="415" role="img" aria-labelledby="chart-xl-near-limit-t chart-xl-near-limit-d">
<title id="chart-xl-near-limit-t">Near the context limit (29 requests): cost and peak context</title>
<desc id="chart-xl-near-limit-d">Two bar groups for the XL session. Cost per session: plain Claude Code $4.461, RTK + Ponytail + Headroom $3.144 (-29.5%), + pxpipe always $2.288 (-48.7%), router with gain policy $1.777 (-60.2%). Peak context: plain 303.2k tokens, RTK + Ponytail + Headroom 207.9k (-31.4%), + pxpipe always 65.5k (-78.4%), router 67.9k (-77.6%).</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--blue:#2a78d6;--red:#e34948}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--blue:#3987e5;--red:#e66767}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1.5}
.base,.down{fill:var(--blue)}.up{fill:var(--red)}.other{fill:var(--muted)}
.zoneA{fill:var(--muted);fill-opacity:.12}.zoneB{fill:var(--blue);fill-opacity:.10}
.line{fill:none;stroke:var(--blue);stroke-width:2}
.dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}
</style>
<text x="24" y="28" class="ink" font-size="16" font-weight="600">Near the context limit (29 requests): cost and peak context</text><text x="24" y="50" class="ink2" font-size="13">Percentages compare each setup with plain Claude Code.</text><text x="24" y="88" class="ink" font-size="14" font-weight="600">Cost per session</text><text x="24" y="120" class="ink2" font-size="13">Plain Claude Code</text><path class="other" d="M24,128H220Q224,128 224,132V146Q224,150 220,150H24Z"/><text x="232" y="143" class="ink" font-size="13">$4.461 (baseline)</text><text x="24" y="180" class="ink2" font-size="13">RTK + Ponytail + Headroom</text><path class="base" d="M24,188H160.9549428379287Q164.9549428379287,188 164.9549428379287,192V206Q164.9549428379287,210 160.9549428379287,210H24Z"/><text x="172.9549428379287" y="203" class="ink" font-size="13">$3.144 (-29.5%)</text><text x="24" y="240" class="ink2" font-size="13">+ pxpipe always</text><path class="base" d="M24,248H122.57789733243665Q126.57789733243665,248 126.57789733243665,252V266Q126.57789733243665,270 122.57789733243665,270H24Z"/><text x="134.57789733243663" y="263" class="ink" font-size="13">$2.288 (-48.7%)</text><text x="24" y="300" class="ink2" font-size="13">Router, gain policy *</text><path class="base" d="M24,308H99.66823582156466Q103.66823582156466,308 103.66823582156466,312V326Q103.66823582156466,330 99.66823582156466,330H24Z"/><text x="111.66823582156466" y="323" class="ink" font-size="13">$1.777 (-60.2%)</text><text x="372" y="88" class="ink" font-size="14" font-weight="600">Peak context</text><text x="372" y="120" class="ink2" font-size="13">Plain Claude Code</text><path class="other" d="M372,128H568Q572,128 572,132V146Q572,150 568,150H372Z"/><text x="580" y="143" class="ink" font-size="13">303.2k tokens (baseline)</text><text x="372" y="180" class="ink2" font-size="13">RTK + Ponytail + Headroom</text><path class="base" d="M372,188H505.1372031662269Q509.1372031662269,188 509.1372031662269,192V206Q509.1372031662269,210 505.1372031662269,210H372Z"/><text x="517.137203166227" y="203" class="ink" font-size="13">207.9k tokens (-31.4%)</text><text x="372" y="240" class="ink2" font-size="13">+ pxpipe always</text><path class="base" d="M372,248H411.20580474934036Q415.20580474934036,248 415.20580474934036,252V266Q415.20580474934036,270 411.20580474934036,270H372Z"/><text x="423.20580474934036" y="263" class="ink" font-size="13">65.5k tokens (-78.4%)</text><text x="372" y="300" class="ink2" font-size="13">Router, gain policy *</text><path class="base" d="M372,308H412.78891820580475Q416.78891820580475,308 416.78891820580475,312V326Q416.78891820580475,330 412.78891820580475,330H372Z"/><text x="424.78891820580475" y="323" class="ink" font-size="13">67.9k tokens (-77.6%)</text><text x="24" y="352" class="ink2" font-size="12">* Router: its session read fewer files in full (7 reads vs 22 to 24), so its cost is not yet</text><text x="24" y="367" class="ink2" font-size="12">separated from session variance.</text><text x="24" y="397" class="ink2" font-size="11">Plain Claude Code = baseline. Opus 5.5. Source: README.md, Results</text>
</svg>
